name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3-dev
      - name: Synthetic terrain
        run: |
          pip3 install numpy
          python3 scripts/gen_synthetic_terrain.py
      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python import libmars
        run: |
          PYTHONPATH=build python3 -c "import libmars; g=libmars.build_full_terrain('data/costmap/jezero_elevation.bin',512,512,1.0); print(g.width, g.height)"
